name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      # TODO: remove LLMTESTLAB_REPO_TOKEN once llm-test-lab is public
      - name: Pack optional platform binaries from GoReleaser
        env:
          GH_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
        run: node scripts/pack-platform-binaries.mjs

      - name: Dry-run npm pack with trusted publishing settings
        run: |
          npm pack --dry-run
          for pkg in packages/*; do
            echo "Packing $pkg"
            npm pack --dry-run "$pkg"
          done
          echo "Trusted publishing is configured (id-token: write, registry-url, provenance). Real npm publish is intentionally not run yet."
          echo "When ready: publish each @llm-test-lab/<platform> package first, then llm-test-lab, all at the GoReleaser tag version with --provenance --access public."
