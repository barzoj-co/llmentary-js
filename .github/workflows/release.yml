name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm pack --dry-run

      - name: Plan optional native proxy packages
        run: |
          cat <<'PLAN'
          Planned esbuild-style optional dependency package names (not published by this workflow yet):
          - @llm-test-lab/linux-x64
          - @llm-test-lab/linux-arm64
          - @llm-test-lab/darwin-x64
          - @llm-test-lab/darwin-arm64
          - @llm-test-lab/win32-x64
          Each package should contain one GoReleaser-built llmtestlab binary plus package.json
          cpu/os metadata, and the root package can list them under optionalDependencies once
          the private proxy release pipeline is ready.
          PLAN

      - name: Publish to npm with provenance
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
