name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Assert tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      # TODO: remove LLMTESTLAB_REPO_TOKEN once llm-test-lab is public
      - name: Pack optional platform binaries from PROXY_VERSION
        env:
          GH_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
        run: |
          LLMTESTLAB_TAG="$(tr -d '[:space:]' < PROXY_VERSION)"
          LLMTESTLAB_ROOT_VERSION="$(node -p "require('./package.json').version")"
          export LLMTESTLAB_TAG LLMTESTLAB_ROOT_VERSION
          node scripts/pack-platform-binaries.mjs

      - name: npm pack root and platform packages
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          for pkg in packages/*; do
            npm pack --pack-destination dist "$pkg"
          done

      - name: Upload tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: dist/*.tgz

  publish:
    name: publish
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install npm with trusted publishing support
        env:
          # renovate: datasource=npm depName=npm
          NPM_VERSION: "11.21.1"
        run: |
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: dist

      - name: Publish platform packages then root
        run: |
          set -euo pipefail
          proxy_version="$(tr -d '[:space:]' < PROXY_VERSION)"
          proxy_version="${proxy_version#v}"
          for spec in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            tarball="dist/llm-test-lab-${spec}-${proxy_version}.tgz"
            if [ ! -f "$tarball" ]; then
              echo "::error::Missing platform tarball $tarball"
              exit 1
            fi
            if npm view "@llm-test-lab/${spec}@${proxy_version}" version >/dev/null 2>&1; then
              echo "skip already-published @llm-test-lab/${spec}@${proxy_version}"
            else
              npm publish "$tarball" --provenance --access public
            fi
          done
          root_version="$(node -p "require('./package.json').version")"
          root_tarball="dist/llm-test-lab-${root_version}.tgz"
          if [ ! -f "$root_tarball" ]; then
            echo "::error::Missing root tarball $root_tarball"
            exit 1
          fi
          if npm view "llm-test-lab@${root_version}" version >/dev/null 2>&1; then
            echo "skip already-published llm-test-lab@${root_version}"
          else
            npm publish "$root_tarball" --provenance --access public
          fi
