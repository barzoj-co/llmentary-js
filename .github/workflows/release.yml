name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      # TODO: remove LLMTESTLAB_REPO_TOKEN once llm-test-lab is public
      - name: Pack optional platform binaries from GoReleaser
        env:
          GH_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
        run: node scripts/pack-platform-binaries.mjs

      - name: Dry-run npm publish with provenance
        run: |
          npm pack --dry-run
          for pkg in packages/*; do
            npm pack --dry-run --workspace "$(node -p "require('./$pkg/package.json').name")"
          done
          echo "Trusted publishing is configured (id-token: write, registry-url). Real npm publish is intentionally not run yet."
          echo "When ready: npm publish --provenance --access public for each @llm-test-lab/<platform> package, then the root llm-test-lab package at the same version as the GoReleaser tag."
