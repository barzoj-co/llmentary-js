name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Require LLMTESTLAB_REPO_TOKEN
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          HAS_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_REPO_TOKEN" != "true" ]; then
            echo "::error::Missing required secret LLMTESTLAB_REPO_TOKEN. It must read the private barzoj-co/llmentary repository so CI can build the Go proxy binary."
            exit 1
          fi

      # TODO: remove once llmentary is public
      - name: Checkout llmentary proxy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: barzoj-co/llmentary
          # TODO: remove once llmentary is public
          token: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
          path: .cache/llmentary
          persist-credentials: false

      - name: Setup Go
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: .cache/llmentary/go.sum

      - name: Build proxy binary
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bin"
          go build -o "$GITHUB_WORKSPACE/.bin/llmentary" ./cmd/llmentary
          test -x "$GITHUB_WORKSPACE/.bin/llmentary"
          echo "LLMENTARY_BIN=$GITHUB_WORKSPACE/.bin/llmentary" >> "$GITHUB_ENV"
        working-directory: .cache/llmentary

      - name: Require built proxy binary
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ ! -x "$LLMENTARY_BIN" ]; then
            echo "::error::CI did not produce LLMENTARY_BIN; real Go proxy tests cannot run."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: |
          if [ "${{ matrix.node }}" = "22" ]; then
            if [ -x "${LLMENTARY_BIN:-}" ]; then
              npm run test:coverage
            else
              npm run test:unit -- --coverage
            fi
            npm run test:jest:unit
          else
            npm run test:unit
            npm run test:jest:unit
          fi

      - name: Real Go proxy tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "${{ matrix.node }}" = "22" ]; then
            npm run test:jest:proxy
          else
            npm run test:proxy
            npm run test:jest:proxy
          fi

      - name: Skip private-binary tests for fork PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping private-binary tests on fork PR because secrets are unavailable."

      - name: Upload coverage
        if: ${{ matrix.node == 22 }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: false
          disable_search: true
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}

  e2e-openai:
    name: OpenAI E2E
    # Maintainers approve this GitHub Environment deployment on each run that
    # needs OPENAI_API_KEY. The Node/pack jobs do not use it.
    environment: openai-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    steps:
      - name: Checkout client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Require LLMTESTLAB_REPO_TOKEN
        env:
          HAS_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_REPO_TOKEN" != "true" ]; then
            echo "::error::Missing required secret LLMTESTLAB_REPO_TOKEN. It must read the private barzoj-co/llmentary repository so CI can build the Go proxy binary."
            exit 1
          fi

      # TODO: remove once llmentary is public
      - name: Checkout llmentary proxy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: barzoj-co/llmentary
          # TODO: remove once llmentary is public
          token: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
          path: .cache/llmentary
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: .cache/llmentary/go.sum

      - name: Build proxy binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bin"
          go build -o "$GITHUB_WORKSPACE/.bin/llmentary" ./cmd/llmentary
          test -x "$GITHUB_WORKSPACE/.bin/llmentary"
          echo "LLMENTARY_BIN=$GITHUB_WORKSPACE/.bin/llmentary" >> "$GITHUB_ENV"
        working-directory: .cache/llmentary

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require OPENAI_API_KEY
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_OPENAI_API_KEY" != "true" ]; then
            echo "::error::Missing required secret OPENAI_API_KEY for real OpenAI E2E tests."
            exit 1
          fi

      - name: OpenAI E2E
        run: npm run test:e2e:openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1

  e2e-gate:
    name: e2e-gate
    if: ${{ always() }}
    needs: [e2e-openai]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require live e2e success
        env:
          E2E_RESULT: ${{ needs.e2e-openai.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash scripts/e2e-gate.sh

  pack:
    name: Pack consumers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Are the types wrong
        run: npm run attw

      - name: Install packed tarball into JS and TS consumers
        run: npm run test:pack
