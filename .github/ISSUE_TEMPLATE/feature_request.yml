name: Feature request
description: Propose a change to the TypeScript/JavaScript client
title: "[feat] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem this would solve. Proxy-binary features belong in https://github.com/barzoj-co/llm-test-lab.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
