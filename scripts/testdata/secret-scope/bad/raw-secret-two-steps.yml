# expect: secret OPENAI_API_KEY used raw in more than one step of job test; presence checks must use the boolean form
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            exit 1
          fi
      - name: use
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo still using it
